# Runs the offline test suite on every push: geometry, the report check, the agent's checks and the replay. No API key.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip && python -m pip install -e '.[test]'
      - run: python -m pytest -q
